name: Build unsigned IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcodebuild -showsdks

      - name: Build app
        run: |
          xcodebuild \
            -project RCall.xcodeproj \
            -scheme RCall \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Add ad-hoc signature for sideload compatibility
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/RCall.app"
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -name '*.framework' -type d -print0 | while IFS= read -r -d '' framework; do
              codesign --force --sign - --timestamp=none "$framework"
            done
          fi
          codesign --force --sign - --timestamp=none "$APP_PATH"
          codesign --display --verbose=4 "$APP_PATH"

      - name: Pack unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/RCall.app build/Payload/
          (cd build && zip -qry RCall-unsigned.ipa Payload)

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RCall-unsigned
          path: build/RCall-unsigned.ipa
          if-no-files-found: error
